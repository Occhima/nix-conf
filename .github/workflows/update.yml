# Hand-maintained. Update PRs are checked by CI but merged manually — no
# auto-merge.
name: Bump Flake Inputs

on:
  workflow_dispatch:
  schedule:
    - cron: 0 1 * * 0

permissions: {}

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Update lockfiles
        run: |
          nix flake update
          nix flake update --flake ./dev

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          title: "chore: update flake inputs"
          commit-message: "chore: update flake inputs"
          branch: update-flake-inputs
          token: ${{ github.token }}
