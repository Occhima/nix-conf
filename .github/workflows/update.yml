# Hand-maintained; actions pinned to full commit SHAs. Update PRs are
# checked by CI but merged manually — no auto-merge.
name: Bump Flake Inputs

on:
  workflow_dispatch:
  schedule:
    - cron: 0 1 * * 0

permissions: {}

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Update lockfiles
        run: |
          nix flake update
          nix flake update --flake ./dev

      - name: Create pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          title: 'chore: update flake inputs'
          commit-message: 'chore: update flake inputs'
          branch: update-flake-inputs
          token: ${{ github.token }}
